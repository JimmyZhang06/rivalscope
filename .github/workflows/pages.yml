name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [agent-main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || 'https://rivalscope-api.jimmyzhang.xyz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate production API origin
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.VITE_API_ORIGIN;
          if (!origin) throw new Error('Set repository variable VITE_API_ORIGIN to the Aliyun API HTTPS origin');
          const url = new URL(origin);
          if (url.protocol !== 'https:' || url.origin !== origin) {
            throw new Error('VITE_API_ORIGIN must be an HTTPS origin without a path or trailing slash');
          }
          NODE
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Preserve SPA routes on direct navigation
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
